name: Gestão Futuro CI

on:
  push:
    branches: [gestao-futuro-pwa]
  pull_request:
    branches: [gestao-futuro-pwa]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao-futuro-pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gestao-futuro-pwa/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs
